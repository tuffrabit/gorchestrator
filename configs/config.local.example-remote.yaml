storage_root: ~/.config/gorchestrator/storage
db_path: ~/.config/gorchestrator/gorchestrator.db
# Local single-model-at-a-time inference via llama-swap.
# The harness explicitly loads the phase's model before each stage and unloads
# after (warmup request -> /running verify; /unload + poll). mode: exclusive
# serializes ALL phases against this server, so it can never be double-booked.
# Remove this block to fall back to implicit swap-on-request behavior.
#
# Sideload exception: an agent with `sideload: true` opts out of this lifecycle
# entirely — its phase takes no exclusive lock and drives no load/unload, and
# its model is protected from other phases' evictions (per-model unload keeps
# it resident). Use it for a small always-loaded model that shares the server
# with the swapped main model (configure llama-swap so the two coexist).
inference:
  type: llama-swap
  base_url: http://192.168.1.132:8080   # management base; chat API is <base>/v1
  mode: exclusive

default_model:
  # Fallback model for any agent stage without its own model block.
  # provider: openai works for llama-swap's OpenAI-compatible endpoint.
  provider: openai
  model: qwen3.6-35b-a3b-reap-48-v2     # must match a model name in your llama-swap config
  api_key_env: OPENAI_API_KEY   # unused by llama-swap, but the field must exist
  base_url: http://192.168.1.132:8080/v1
  timeout: 10m

tools:
  read_file:
    max_bytes: 65536
    max_lines: 2000

# Three-stage local arrangement: fast researcher -> big single-shot planner -> mid implementer.
# Every stage boundary is a human gate by default (adjudicator defaults to "human";
# "self" opts back into agent self-approval, "null" disables gating entirely).
# Each stage's model block points at llama-swap; the harness swaps models between stages.
agents:
  # RESEARCHER: fast + tool-using. Explores the workspace (read_file, list_directory,
  # grep_search) and writes a context digest for the planner. Value is throughput,
  # not depth — use the fastest model you have.
  tielexplorer:
    max_attempts: 3
    # sideload: true   # if the researcher model is a small always-resident one:
    #                  # skips lock/load/unload and is spared from evictions
    model:
      provider: openai
      base_url: http://192.168.1.132:8080/v1
      model: tiel-coder-35b-a3b-mtp-ud-q4_k_xl
      timeout: 60m
    tools: [read_file, list_directory, grep_search, write_output]
    system_prompt: |
        You are an explorer agent. Your job is to explore the file system in the context of the user's input or questions and return answers and insights based on your findings.
        You have access to these tools:
        - read_file: read a file's content (whole-file or surgical line range)
        - list_directory: list a directory
        - grep_search: search file contents
        - write_output: write your final findings to the designated output file
        Rules:
        1. Use tools to gather information from the allowed paths.
        2. If prompted to or asked you can write your final findings using the write_output tool.
        3. As the users's input and prompts and questions to inform your file system exploration and reasoning.
  sharpsparkexplorer:
