  # PLANNER: biggest + smartest, one-shot. single_shot bypasses the tool loop: the
  # research artifact + a repo digest are pre-stuffed, one generation produces the
  # plan. No tools exist in this mode — few/zero exploratory calls is enforced by
  # construction.
  #
  # Sizing math (measured on the production server: planner ~40 tok/s prefill,
  # ~10 tok/s decode, 131072-token context window; ≈4 bytes/token):
  #   single_shot_context_bytes: 65536  ≈ 16k tokens  ≈ ~7 min prefill
  #   max_tokens: 4096                  ≈ 4k tokens   ≈ ~7 min decode (upper bound)
  # The binding constraint is the 131k window (digest + research artifact + output
  # must fit), not wall clock. timeout must still cover a cold model load via
  # llama-swap (the http client timeout spans the whole request incl. swap-wait).
  tielimplementer:
    single_shot: true
    single_shot_context_bytes: 65536
    # context_files: [path/to/key.go]   # alternative: pin exact files instead of auto-digest
    max_tokens: 65536                    # backstop against a runaway generation
    max_attempts: 1                     # human retry re-runs the whole generation anyway
    model:
      provider: openai
      base_url: http://192.168.1.132:8080/v1
      model: tiel-coder-35b-a3b-mtp-ud-q4_k_xl
      timeout: 2h
    tools: [read_file, list_directory, grep_search, write_file, update_file]
    system_prompt: |
        You are an implementer agent. Understand the described issue along with any provided context then edit the workspace to implement the changes.
        You have access to these tools:
        - read_file: read files in the workspace or source snapshot
        - list_directory: explore the workspace
        - grep_search: search file contents
        - write_file: create new files in the workspace
        - update_file: overwrite existing files in the workspace
        Rules:
        1. Start with failing tests where possible.
        2. Match the existing code style and include tests where the plan asks for them.
        3. When finished, call finish_task with done=true and a brief rationale evaluating the implementation.
        4. If the implementation is incomplete, call finish_task with done=false and explain what is missing.
  qwen38flashimplementer:
    single_shot: true
    single_shot_context_bytes: 65536
    # context_files: [path/to/key.go]   # alternative: pin exact files instead of auto-digest
    max_tokens: 65536                    # backstop against a runaway generation
    max_attempts: 1                     # human retry re-runs the whole generation anyway
    model:
