storage_root: ~/.config/gorchestrator/storage
db_path: ~/.config/gorchestrator/gorchestrator.db
default_model:
  # Supported providers: openai, anthropic, gemini, dryrun
  # For OpenAI-compatible local endpoints (llama.cpp/Ollama), use provider: openai
  # and set base_url to the local endpoint.
  provider: openai
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  # base_url: http://localhost:8080/v1
  timeout: 360s

tools:
  read_file:
    max_bytes: 65536
    max_lines: 2000

# Agent definitions. Every key under agents: is a user-chosen agent id —
# a lowercase slug of letters/digits/_/- (max 32 chars), e.g. researcher,
# planner, coder, reviewer. Ids are not magic words: a project references
# them via default_flow, or the submit flow picks them per issue (1-8 ids,
# frozen on the issue; each id runs as one step: step-1, step-2, ...).
# Merge: generic defaults (default_model above, human adjudicator, attempt
# caps) → agents.<id>. There are no built-in prompts and no per-project
# agent overrides — everything an agent is lives in its block here.
# agents:
#   researcher:
#     system_prompt: "You are a research agent. Read the issue and the repository, then write a grounded findings summary as your output."  # REQUIRED for every agent; there is no built-in default
#     adjudicator: human  # default; "self" opts back into agent self-approval
#     max_attempts: 3
#     loops: 1
#     temperature: 0.2
#     # max_tokens: 8192
#     # tools: [read_file, list_directory, grep_search, write_output]  # OPTIONAL
#     #   narrowing; omit or empty = the full core list: read_file,
#     #   list_directory, grep_search, write_output, write_file,
#     #   update_file (+ run_test when the project sets test:)
#     # mcp_servers: []          # OPTIONAL per-agent allowlist, deny by
#     #   default; use ["*"] for every server under mcp_servers:
#     # single_shot: true        # allowed for ANY agent: one no-tools call;
#     #   the reply text is the step output (no finish_task). A single-shot
#     #   step gets no tools, so it can never edit the workspace even if
#     #   tools: names editing tools.
#     # single_shot_context_bytes: 32768  # repo digest budget pre-stuffed into the prompt
#     # context_files: [main.go, ...]     # pin exact files instead of the auto digest
#     # sideload: true           # model lives outside the inference lifecycle:
#     #   no lock/load/unload for this step, and the model is spared from
#     #   other steps' evictions. For a small always-resident model that
#     #   shares the server with the swapped main model.
#     # (token_budget on agents removed — use top-level providers: map)
#     model:
#       provider: openai
#       model: o3-mini
#   planner:
#     system_prompt: "You are a planning agent. Turn the accepted research output into a concrete, ordered implementation plan."
#     adjudicator: human  # default; "self" opts back into agent self-approval
#     max_attempts: 3
#     loops: 1
#     tools: [read_file, list_directory, grep_search, write_output]  # example narrowing: plan without edit tools
#   coder:
#     system_prompt: "You are an implementer agent. Apply the plan in the shared workspace, then finish with a summary of what changed."
#     adjudicator: human  # default; "self" opts back into agent self-approval
#     max_attempts: 3
#     loops: 1
#     mcp_servers: []          # default: no MCP tools; use ["*"] for every configured server
#   reviewer:
#     system_prompt: "You are a reviewer agent. Compare the accepted output against the issue and the workspace, then list concrete findings."
#     single_shot: true        # example: a one-call reviewer; its reply text is the output

# Projects are declared ONLY here (YAML). Process start upserts the SQLite registry.
# Issue submit / CLI / webhook hard-fail on unknown names — no create-on-submit.
# source_path / git / test / default_flow live under the project; not on the submit form.
# Scope detection: title + description + attachment names/bodies are scanned at
# submit; pathological issues land waiting_human on the first step until a human
# passes. No extra YAML required for the default phrase list.
# projects:
#   acme:
#     source_path: /path/to/acme     # local snapshot mode; omit when using git
#     default_flow: [researcher, planner, coder]  # ordered agent ids used when a
#     #   webhook/adapter/CLI submit carries no flow, and to prefill the web
#     #   submit form (editable there). Every id must exist under agents: (1-8).
#     #   With no default_flow and no flow given, the submit is rejected —
#     #   there is no implicit pipeline.
#     # git:
#     #   repo_url: "git@github.com:myorg/acme.git"
#     #   base_branch: main
#     #   push: false
#     #   create_pr: false
#     #   auth:
#     #     type: ssh_key
#     # test:
#     #   command: "go test ./..."
#     #   timeout: 60s
#     #   image: "golang:1.22"
#     #   secrets_env: []
#     trust_external: false

# MCP servers (deny by default). Only agents that list a server in mcp_servers see its tools.
# Empty tools: = all tools from the server (Phase 4 compat). Non-empty: allowlist only.
# In an agent block, mcp_servers: ["*"] means every server listed here.
# mcp_servers:
#   - name: internal-api
#     command: ["./bin/my-mcp-server"]
#     args: []
#     env: [API_TOKEN]         # host env var NAMES passed through; values not logged
#     tools:
#       - name: query_database
#         constraints:
#           - type: arg_prefix
#             arg: sql
#             prefix: "SELECT"
#       - name: call_http
#         constraints:
#           - type: url_allowlist
#             arg: url
#             hosts: ["api.internal.example"]

# External adapters are declared explicitly by name + manifest path.
# The core does not scan directories for adapters.
# adapters:
#   - name: s3
#     manifest_path: ~/.config/gorchestrator/adapters/s3.yaml
#   - name: slack
#     manifest_path: ./adapters/slack.yaml
#   - name: email
#     manifest_path: ./adapters/email.yaml

# Long-running daemon (`gorchestrator serve`)
server:
  listen: "127.0.0.1:8080"
  max_concurrent_issues: 2
  shutdown_timeout: 30s
  public_base_url: "http://127.0.0.1:8080"

# Authentication for the dashboard and HTTP API.
# mode: local (dev/test) | oidc (production)
auth:
  mode: local
  local_username: admin
  local_password_env: GORCH_LOCAL_PASSWORD
  # oidc:
  #   issuer_url: "https://accounts.google.com"
  #   client_id: "..."
  #   client_secret_env: GORCH_OIDC_CLIENT_SECRET
  #   scopes: ["openid", "profile", "email"]
  bootstrap_admin_emails:
    - admin@example.com
  session_ttl: 168h

# Notification sinks (console is always on when serve runs).
# List adapter names that implement port: notification.
notifications:
  adapters: []
  # adapters: [slack, email]

# Storage backend: fs (default) or adapter (e.g. S3 via JSON-RPC).
storage:
  backend: fs
  # adapter_name: s3

# External triggers (webhook is built-in; github/jira are adapters).
triggers:
  webhook:
    enabled: false
    token_env: GORCH_WEBHOOK_TOKEN
  adapters: []
  # adapters: [github, jira]
  trust_external: false   # external issues force a human gate on steps with editing tools

